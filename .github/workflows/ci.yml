name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff linter
        run: ruff check app tests

      - name: Run pytest
        run: pytest tests/ -v

  build-and-push:
    name: Build and Push Artifacts
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.1'

      - name: Log in to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          helm package charts/aggregator -d /tmp

      - name: Push Helm chart to GHCR
        run: |
          CHART_FILE=$(ls /tmp/aggregator-*.tgz)
          helm push ${CHART_FILE} oci://ghcr.io/${{ github.repository }}

  integration-test:
    name: Integration Test on Minikube
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: v1.29.0

      - name: Verify Minikube status
        run: |
          minikube status
          kubectl get nodes

      - name: Install OpenBao with plugin
        run: |
          kubectl create namespace openbao --dry-run=client -o yaml | kubectl apply -f -
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo update
          helm upgrade --install openbao openbao/openbao \
            --namespace openbao \
            --set injector.enabled=false \
            --set server.standalone.enabled=true \
            --set server.dev.enabled=true \
            --set server.dev.rootToken="root" \
            --set ui.enabled=true \
            --wait

      - name: Configure oauthapp plugin
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=openbao -n openbao --timeout=120s
          kubectl exec -n openbao deployment/openbao -- sh -c '
            cd /tmp && \
            curl -L -o oauthapp.zip https://github.com/openbao/openbao-plugin-secrets-oauthapp/releases/download/v3.4.1/openbao-plugin-secrets-oauthapp_v3.4.1_linux_amd64.zip && \
            unzip -o oauthapp.zip && \
            mv openbao-plugin-secrets-oauthapp /vault/plugins/oauthapp && \
            chmod +x /vault/plugins/oauthapp && \
            rm -f oauthapp.zip
          '
          SHA256=$(kubectl exec -n openbao deployment/openbao -- sha256sum /vault/plugins/oauthapp | awk '{print $1}')
          kubectl exec -n openbao deployment/openbao -- vault plugin register -sha256="$SHA256" secret oauthapp
          kubectl exec -n openbao deployment/openbao -- vault secrets enable -path=oauth2 oauthapp || true
          kubectl exec -n openbao deployment/openbao -- sh -c 'echo "path \"oauth2/*\" { capabilities = [\"create\", \"read\", \"update\", \"delete\", \"list\"] }" | vault policy write aggregator -'
          AGGREGATOR_TOKEN=$(kubectl exec -n openbao deployment/openbao -- vault token create -policy=aggregator -format=json -ttl=24h | jq -r '.auth.client_token')
          kubectl create namespace aggregator --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic aggregator-openbao -n aggregator --from-literal=OPENBAO_TOKEN="$AGGREGATOR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -

      - name: Build and load Docker image
        run: |
          docker build -t integration-aggregator:latest .
          minikube image load integration-aggregator:latest

      - name: Deploy mock OAuth server
        run: |
          helm repo add navikt https://navikt.github.io/charts
          helm repo update
          helm upgrade --install mock-oauth oci://ghcr.io/navikt/mock-oauth2-server \
            --namespace aggregator \
            --set httpPort=8080 \
            --set-json 'config={"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"code","match":"*","claims":{"sub":"test-user"}}]}]}' \
            --wait

      - name: Deploy aggregator
        run: |
          helm upgrade --install aggregator charts/aggregator \
            --namespace aggregator \
            --set image.repository=integration-aggregator \
            --set image.tag=latest \
            --set openbao.address=http://openbao.openbao.svc.cluster.local:8200 \
            --wait

      - name: Wait for aggregator to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=aggregator -n aggregator --timeout=60s

      - name: Port-forward to aggregator and mock OAuth
        run: |
          kubectl port-forward -n aggregator svc/aggregator 8000:80 &
          PF_PID=$!
          echo $PF_PID > /tmp/pf_pid
          kubectl port-forward -n aggregator svc/mock-oauth 8080:8080 &
          MOCK_PF_PID=$!
          echo $MOCK_PF_PID > /tmp/mock_pf_pid
          sleep 5

      - name: Run smoke test
        run: |
          export AGGREGATOR_URL=http://localhost:8000
          bash scripts/smoke.sh

      - name: Set up k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/

      - name: Run performance test
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          export AGGREGATOR_URL=http://localhost:8000
          k6 run perf/token_retrieval.js --out json=/tmp/perf-results.json

      - name: Generate performance report
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          with open('/tmp/perf-results.json', 'r') as f:
              data = [json.loads(line) for line in f]

          metrics = {}
          for item in data:
              if item.get('type') == 'Point' and 'data' in item:
                  metric_name = item['metric'].get('name', '')
                  if metric_name:
                      if metric_name not in metrics:
                          metrics[metric_name] = []
                      if 'value' in item['data']:
                          metrics[metric_name].append(item['data']['value'])

          report = []
          report.append("# Performance Test Report\n")
          report.append(f"Generated: {datetime.utcnow().isoformat()}\n\n")
          report.append("## Token Retrieval Endpoint\n\n")
          report.append("### Latency\n\n")

          if 'http_req_duration' in metrics:
              durations = sorted(metrics['http_req_duration'])
              p50 = durations[int(len(durations) * 0.5)] * 1000
              p95 = durations[int(len(durations) * 0.95)] * 1000
              report.append(f"- p50: {p50:.2f} ms\n")
              report.append(f"- p95: {p95:.2f} ms\n\n")

          report.append("### Throughput\n\n")
          if 'http_reqs' in metrics:
              total_reqs = sum(metrics['http_reqs'])
              report.append(f"- Total requests: {total_reqs}\n")
              report.append(f"- Requests per second: {total_reqs / 30:.2f}\n\n")

          with open('/tmp/perf-report.md', 'w') as f:
              f.writelines(report)
          EOF

      - name: Upload performance report
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: /tmp/perf-report.md

      - name: Cleanup port-forward
        if: always()
        run: |
          if [ -f /tmp/pf_pid ]; then
            kill $(cat /tmp/pf_pid) || true
          fi
          if [ -f /tmp/mock_pf_pid ]; then
            kill $(cat /tmp/mock_pf_pid) || true
          fi
