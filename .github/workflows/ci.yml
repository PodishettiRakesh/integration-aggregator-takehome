name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  packages: write

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Ruff linter
        run: ruff check app tests

      - name: Run pytest
        run: pytest tests/ -v

  build-and-push:
    name: Build and Push Artifacts
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository
        id: repo
        run: |
          echo "lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.lowercase }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.16.1'

      - name: Log in to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Package Helm chart
        run: |
          helm package charts/aggregator -d /tmp

      - name: Push Helm chart to GHCR
        run: |
          CHART_FILE=$(ls /tmp/aggregator-*.tgz)
          helm push ${CHART_FILE} oci://ghcr.io/${{ steps.repo.outputs.lowercase }}

  integration-test:
    name: Integration Test on Minikube
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          sudo apt-get update && sudo apt-get install -y jq

      - name: Set up Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: v1.30.0

      - name: Verify Minikube status
        run: |
          minikube status
          kubectl get nodes

      - name: Install OpenBao with plugin
        run: |
          kubectl create namespace openbao --dry-run=client -o yaml | kubectl apply -f -
          helm repo add openbao https://openbao.github.io/openbao-helm
          helm repo update
          helm upgrade --install openbao openbao/openbao \
            --namespace openbao \
            --set injector.enabled=false \
            --set server.dev.enabled=true \
            --set server.dev.rootToken="root" \
            --set ui.enabled=true \
            --set server.volumes[0].name=plugins \
            --set server.volumes[0].emptyDir.medium="" \
            --set server.volumeMounts[0].name=plugins \
            --set server.volumeMounts[0].mountPath=/vault/plugins \
            --set server.extraArgs='-dev-plugin-dir=/vault/plugins' \
            --wait

      - name: Configure oauthapp plugin
        run: |
          set -e
          
          echo "=== A. Downloading oauthapp plugin v3.4.1 on runner ==="
          curl -fL --retry 3 -o /tmp/oauthapp.tar.xz https://github.com/openbao/openbao-plugin-secrets-oauthapp/releases/download/v3.4.1/openbao-plugin-secrets-oauthapp-v3.4.1-linux-amd64.tar.xz

          echo "Extracting plugin on runner..."
          tar -xf /tmp/oauthapp.tar.xz -C /tmp

          echo "Listing archive contents..."
          tar -tf /tmp/oauthapp.tar.xz

          echo "Identifying plugin binary..."
          PLUGIN_BINARY=$(tar -tf /tmp/oauthapp.tar.xz | head -1)
          echo "Plugin binary: $PLUGIN_BINARY"

          if [ -z "$PLUGIN_BINARY" ]; then
            echo "Error: Failed to identify plugin binary from archive"
            exit 1
          fi

          echo "Verifying extracted binary exists and is executable..."
          if [ ! -f "/tmp/$PLUGIN_BINARY" ]; then
            echo "Error: Extracted binary not found at /tmp/$PLUGIN_BINARY"
            exit 1
          fi
          chmod +x "/tmp/$PLUGIN_BINARY"

          echo "Calculating plugin SHA256 on runner..."
          RUNNER_SHA256=$(sha256sum "/tmp/$PLUGIN_BINARY" | awk '{print $1}')
          echo "Runner SHA256: $RUNNER_SHA256"

          if [ -z "$RUNNER_SHA256" ]; then
            echo "Error: Failed to calculate SHA256 on runner"
            exit 1
          fi
          
          echo "=== B. Verifying OpenBao plugin directory ==="
          echo "Waiting for OpenBao pod to be ready..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=openbao -n openbao --timeout=120s
          
          echo "Checking if /vault/plugins directory exists in OpenBao pod..."
          if ! kubectl exec -n openbao pod/openbao-0 -- sh -c 'test -d /vault/plugins'; then
            echo "Error: /vault/plugins directory does not exist in OpenBao pod"
            echo "The Helm installation must configure the plugin directory mount correctly"
            echo "Expected: server.standalone.volumeMounts with mountPath=/vault/plugins"
            exit 1
          fi
          
          echo "Verifying /vault/plugins is a mount point (not a regular directory)..."
          kubectl exec -n openbao pod/openbao-0 -- sh -c 'mount | grep /vault/plugins || true'
          
          echo "=== C. Transferring and verifying plugin binary ==="
          echo "Copying plugin binary to OpenBao pod..."
          kubectl cp "/tmp/$PLUGIN_BINARY" openbao/openbao-0:/vault/plugins/oauthapp

          echo "Setting executable permissions on plugin in pod..."
          kubectl exec -n openbao pod/openbao-0 -- chmod +x /vault/plugins/oauthapp

          echo "Verifying plugin file exists in pod..."
          if ! kubectl exec -n openbao pod/openbao-0 -- sh -c 'test -f /vault/plugins/oauthapp'; then
            echo "Error: Plugin file not found in pod after transfer"
            exit 1
          fi

          echo "Calculating SHA256 of plugin in pod..."
          POD_SHA256=$(kubectl exec -n openbao pod/openbao-0 -- sha256sum /vault/plugins/oauthapp | awk '{print $1}')
          echo "Pod SHA256: $POD_SHA256"

          echo "Comparing checksums..."
          if [ "$RUNNER_SHA256" != "$POD_SHA256" ]; then
            echo "Error: SHA256 mismatch between runner and pod"
            echo "Runner: $RUNNER_SHA256"
            echo "Pod: $POD_SHA256"
            exit 1
          fi
          echo "Checksums match"
          
          echo "=== D. Registering and configuring OpenBao ==="
          echo "Registering oauthapp plugin with verified checksum..."
          kubectl exec -n openbao pod/openbao-0 -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault plugin register -sha256="$RUNNER_SHA256" secret oauthapp

          echo "Checking if oauth2 secrets engine is already enabled..."
          if kubectl exec -n openbao pod/openbao-0 -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault secrets list -format=json | jq -e '.["oauth2/"]' > /dev/null 2>&1; then
            echo "oauth2 secrets engine already enabled"
          else
            echo "Enabling oauth2 secrets engine..."
            kubectl exec -n openbao pod/openbao-0 -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault secrets enable -path=oauth2 oauthapp
          fi

          echo "Writing aggregator policy..."
          POLICY_BASE64=$(echo 'path "oauth2/*" { capabilities = ["create", "read", "update", "delete", "list"] }' | base64 -w 0)
          kubectl exec -n openbao pod/openbao-0 -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root sh -c "echo '$POLICY_BASE64' | base64 -d | vault policy write aggregator -"

          echo "Verifying policy was created..."
          kubectl exec -n openbao pod/openbao-0 -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault policy read aggregator

          echo "Creating aggregator token with 24h TTL..."
          AGGREGATOR_TOKEN=$(kubectl exec -n openbao pod/openbao-0 -- env VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=root vault token create -policy=aggregator -format=json -ttl=24h | jq -r '.auth.client_token')
          
          if [ -z "$AGGREGATOR_TOKEN" ]; then
            echo "Error: Failed to create aggregator token"
            exit 1
          fi
          
          echo "Token created successfully (length: ${#AGGREGATOR_TOKEN})"
          
          echo "Creating aggregator namespace..."
          kubectl create namespace aggregator --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Creating aggregator-openbao secret..."
          kubectl create secret generic aggregator-openbao -n aggregator --from-literal=OPENBAO_TOKEN="$AGGREGATOR_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          
          echo "Verifying secret was created..."
          kubectl get secret aggregator-openbao -n aggregator
          
          echo "=== E. Cleanup ==="
          echo "Cleaning up temporary files on runner..."
          rm -f /tmp/oauthapp.tar.xz "/tmp/$PLUGIN_BINARY"

      - name: Build and load Docker image
        run: |
          docker build -t integration-aggregator:latest .
          minikube image load integration-aggregator:latest

      - name: Deploy mock OAuth server
        run: |
          kubectl create namespace aggregator --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -n aggregator -f - <<EOF
apiVersion: v1
kind: Service
metadata:
  name: mock-oauth
  labels:
    app: mock-oauth
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: mock-oauth
EOF

          kubectl apply -n aggregator -f - <<EOF
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-oauth
  labels:
    app: mock-oauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-oauth
  template:
    metadata:
      labels:
        app: mock-oauth
    spec:
      containers:
        - name: mock-oauth
          image: ghcr.io/navikt/mock-oauth2-server:6.1.3
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JSON_CONFIG
              value: '{"interactiveLogin":false,"tokenCallbacks":[{"issuerId":"default","requestMappings":[{"requestParam":"code","match":"*","claims":{"sub":"test-user"}}]}]}'
          livenessProbe:
            httpGet:
              path: /isalive
              port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /isalive
              port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
EOF

          kubectl wait --for=condition=available deployment/mock-oauth -n aggregator --timeout=120s

      - name: Deploy aggregator
        run: |
          helm upgrade --install aggregator charts/aggregator \
            --namespace aggregator \
            --set image.repository=integration-aggregator \
            --set image.tag=latest \
            --set openbao.address=http://openbao.openbao.svc.cluster.local:8200 \
            --wait

      - name: Wait for aggregator to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=aggregator -n aggregator --timeout=60s

      - name: Port-forward to aggregator and mock OAuth
        run: |
          kubectl port-forward -n aggregator svc/aggregator 8000:80 &
          PF_PID=$!
          echo $PF_PID > /tmp/pf_pid
          kubectl port-forward -n aggregator svc/mock-oauth 8080:8080 &
          MOCK_PF_PID=$!
          echo $MOCK_PF_PID > /tmp/mock_pf_pid
          sleep 5

      - name: Run smoke test
        run: |
          export AGGREGATOR_URL=http://localhost:8000
          bash scripts/smoke.sh

      - name: Set up k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -L | tar xvz
          sudo mv k6-v0.54.0-linux-amd64/k6 /usr/local/bin/

      - name: Run performance test
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          export AGGREGATOR_URL=http://localhost:8000
          k6 run perf/token_retrieval.js --out json=/tmp/perf-results.json

      - name: Generate performance report
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          python3 << 'EOF'
          import json
          from datetime import datetime

          with open('/tmp/perf-results.json', 'r') as f:
              data = [json.loads(line) for line in f]

          metrics = {}
          for item in data:
              if item.get('type') == 'Point' and 'data' in item:
                  metric_name = item['metric'].get('name', '')
                  if metric_name:
                      if metric_name not in metrics:
                          metrics[metric_name] = []
                      if 'value' in item['data']:
                          metrics[metric_name].append(item['data']['value'])

          report = []
          report.append("# Performance Test Report\n")
          report.append(f"Generated: {datetime.utcnow().isoformat()}\n\n")
          report.append("## Token Retrieval Endpoint\n\n")
          report.append("### Latency\n\n")

          if 'http_req_duration' in metrics:
              durations = sorted(metrics['http_req_duration'])
              p50 = durations[int(len(durations) * 0.5)] * 1000
              p95 = durations[int(len(durations) * 0.95)] * 1000
              report.append(f"- p50: {p50:.2f} ms\n")
              report.append(f"- p95: {p95:.2f} ms\n\n")

          report.append("### Throughput\n\n")
          if 'http_reqs' in metrics:
              total_reqs = sum(metrics['http_reqs'])
              report.append(f"- Total requests: {total_reqs}\n")
              report.append(f"- Requests per second: {total_reqs / 30:.2f}\n\n")

          with open('/tmp/perf-report.md', 'w') as f:
              f.writelines(report)
          EOF

      - name: Upload performance report
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: /tmp/perf-report.md

      - name: Cleanup port-forward
        if: always()
        run: |
          if [ -f /tmp/pf_pid ]; then
            kill $(cat /tmp/pf_pid) || true
          fi
          if [ -f /tmp/mock_pf_pid ]; then
            kill $(cat /tmp/mock_pf_pid) || true
          fi
