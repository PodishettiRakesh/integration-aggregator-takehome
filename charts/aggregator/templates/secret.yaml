{{- if and .Values.openbao.token (not .Values.openbao.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aggregator.fullname" . }}-openbao
  labels:
    {{- include "aggregator.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENBAO_TOKEN: {{ .Values.openbao.token | quote }}
{{- end }}
